name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Smoke-test executable JAR
        run: |
          java -jar target/kingbase-ddl-exporter.jar --version
          java -jar target/kingbase-ddl-exporter.jar export --help
          mkdir launcher-smoke
          cp target/kingbase-ddl-exporter.jar start.sh launcher-smoke/
          launcher-smoke/start.sh --version
